name: Build Glyde

# Not yet run. Firefox is a very large build: it needs a public repository (free larger
# runners) or paid larger runners. See docs/BUILDING.md.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the finished builds as a GitHub release (tick this for a real release)"
        type: boolean
        default: false
      tag:
        description: "Release tag, for example v0.1.0. Leave empty to use the version in browser/glyde.json"
        type: string
        default: ""

jobs:
  checks:
    # Quick (about a minute): tests for the Glyde modules, run before the long builds are worth waiting for.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test browser/tests/modules.test.mjs

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force || true
          sudo swapoff -a || true
          sudo fallocate -l 32G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          df -h /
          free -h
          nproc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install branding dependency
        run: pip install pillow

      - name: Fetch and verify Firefox source
        run: bash browser/scripts/fetch-source.sh

      - name: Generate branding
        run: python3 browser/scripts/make-branding.py build/firefox-*/

      - name: Replace the Firefox name in visible text
        run: python3 browser/scripts/rebrand-strings.py build/firefox-*/

      - name: Apply Glyde configuration
        run: bash browser/scripts/apply-config.sh build/firefox-*/ linux

      - name: Bootstrap toolchains
        working-directory: build
        run: |
          cd firefox-*/
          ./mach --no-interactive bootstrap --application-choice browser

      - name: Build
        working-directory: build
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cd firefox-*/
          (while true; do sleep 180; echo "[monitor] $(date +%T)"; df -h / | tail -1; free -m | sed -n 2,3p; done) &
          ./mach build -j2

      - name: Package
        working-directory: build
        run: |
          cd firefox-*/
          ./mach package

      - name: Add policies and create archive
        run: bash browser/scripts/post-package.sh build/firefox-*/

      - uses: actions/upload-artifact@v4
        with:
          name: glyde-linux-x86_64
          path: dist/glyde-linux-x86_64.tar.xz
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Install tools for the Windows cross build
        run: sudo apt-get update && sudo apt-get install -y zip unzip msitools

      - name: Free up disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/.ghcup
          sudo docker image prune --all --force || true
          sudo swapoff -a || true
          sudo fallocate -l 32G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          df -h /
          free -h
          nproc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install branding dependency
        run: pip install pillow

      - name: Fetch and verify Firefox source
        run: bash browser/scripts/fetch-source.sh

      - name: Generate branding
        run: python3 browser/scripts/make-branding.py build/firefox-*/

      - name: Replace the Firefox name in visible text
        run: python3 browser/scripts/rebrand-strings.py build/firefox-*/

      - name: Apply Glyde configuration
        run: bash browser/scripts/apply-config.sh build/firefox-*/ windows

      - name: Bootstrap toolchains
        working-directory: build
        run: |
          cd firefox-*/
          ./mach --no-interactive bootstrap --application-choice browser

      - name: Add the Rust Windows target
        run: rustup target add x86_64-pc-windows-msvc

      - name: Build
        working-directory: build
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cd firefox-*/
          (while true; do sleep 180; echo "[monitor] $(date +%T)"; df -h / | tail -1; free -m | sed -n 2,3p; done) &
          ./mach build -j2

      - name: Package
        working-directory: build
        run: |
          cd firefox-*/
          ./mach package

      - name: Add policies and create zip
        run: bash browser/scripts/post-package-windows.sh build/firefox-*/

      - uses: actions/upload-artifact@v4
        with:
          name: glyde-windows-x86_64
          path: dist/glyde-windows-x86_64.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          VERSION="$(python3 -c "import json;print(json.load(open('browser/glyde.json'))['version'])")"
          TAG="${TAG_INPUT:-v$VERSION}"
          # Fingerprints that the in-browser updater checks before it installs anything.
          (cd release-files && sha256sum glyde-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -l release-files
          gh release create "$TAG" release-files/* \
            --title "Glyde ${TAG#v}" \
            --notes "Glyde ${TAG#v}. Unzip (Windows) or extract (Linux), then run glyde. Glyde is built on Mozilla open source technology and is not officially associated with Mozilla or its products." \
            --prerelease
