name: Rebuild search index
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd search && npm test
      - run: cd search && npm run crawl
      - name: Commit index if it changed
        run: |
          git config user.name "Glyde bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search/data/index.json
          git diff --cached --quiet || (git commit -m "Update search index" && git push)
